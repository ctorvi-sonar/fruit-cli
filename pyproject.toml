[project]
name = "fruit-cli"
version = "0.1.0"
description = "A CLI tool to generate random fruits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fruit = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "fruit_catalog", "fruit_selection", "fruit_output"]
